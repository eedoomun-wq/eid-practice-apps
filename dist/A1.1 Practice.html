:root{
  --teal:#2EC4B6;--teal-d:#22A99D;--teal-l:#E8FAF8;--teal-ink:#166F68;
  --coral:#FF6B6B;--coral-d:#E85555;--coral-l:#FFF0F0;--coral-ink:#C23B3B;
  --amber:#FFB347;--amber-l:#FFF8EC;--amber-ink:#8A5300;--amber-d:#E89A2E;
  --purple:#A78BFA;--purple-d:#7C5CE8;--purple-l:#F3EFFF;--purple-ink:#6D4FD1;
  --ok:#4CAF50;--ok-ink:#2E7D32;--ok-l:#EAF6EA;--bad:#EF5350;--bad-ink:#C62828;--bad-l:#FDECEC;
  --text:#2D3436;--text2:#5F6B70;--muted:#798D96;
  --bg:#F7F9FB;--card:#FFFFFF;--soft:#FAFBFC;--line:#E9EEF2;--line2:#DCE3E9;
  --r:20px;--r-sm:16px;--shadow:0 1px 2px rgba(45,52,54,.06),0 4px 16px rgba(45,52,54,.06);
  --ease:cubic-bezier(.4,0,.2,1);
  --font:'Nunito','Varela Round',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ar:"Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
  --acc:var(--teal);--acc-d:var(--teal-d);--acc-l:var(--teal-l);--acc-ink:var(--teal-ink);
}
body[data-acc=purple]{--acc:var(--purple);--acc-d:var(--purple-d);--acc-l:var(--purple-l);--acc-ink:var(--purple-ink)}
body[data-acc=amber]{--acc:var(--amber);--acc-d:var(--amber-d);--acc-l:var(--amber-l);--acc-ink:var(--amber-ink)}
body[data-acc=coral]{--acc:var(--coral);--acc-d:var(--coral-d);--acc-l:var(--coral-l);--acc-ink:var(--coral-ink)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;font-weight:500;line-height:1.55;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.25;font-weight:800}
h1{font-size:1.55rem;font-weight:900}h2{font-size:1.2rem}h3{font-size:1.05rem}
p{margin:0 0 8px}
a{color:var(--teal-ink)}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:16px 16px 40px}
main{flex:1;outline:none}
.foot{text-align:center;color:var(--text2);font-size:.85rem;padding:16px 16px 24px}
[dir=rtl][lang=ar] .en{font-family:var(--font);font-weight:800;color:var(--purple-ink);unicode-bidi:isolate}
[dir=rtl][lang=ar],.ar{font-family:var(--ar);direction:rtl;text-align:right;line-height:1.9;font-size:1.08rem}
.label,.label-h{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:0 0 8px}
.label-h{margin:20px 0 8px;display:block}
.sec{color:var(--text2)}.muted{color:var(--muted)}
.small-t{font-size:.9rem}
.hl{font-weight:800;color:var(--purple-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.mt{margin-top:24px}.mt8{margin-top:8px}.mb{margin-bottom:16px}
.x-hide{display:none !important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:6px 12px}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--acc)}
.top-home{display:flex;align-items:center;gap:8px;background:none;border:0;font-weight:900;font-size:1.05rem;min-height:44px;padding:4px 8px;border-radius:12px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-home:focus-visible,.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.list-row:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px}
.logo-dot{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--teal);box-shadow:inset -4px -4px 0 var(--teal-d)}
.topbar .pill-btn{flex:0 0 auto}
.pill-btn{min-height:44px;min-width:44px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.pill-btn[aria-pressed=true]{background:var(--teal-l);border-color:var(--teal);color:var(--teal-ink)}
#arBtn[aria-pressed=true]{background:var(--purple-l);border-color:var(--purple);color:var(--purple-ink)}
@media (max-width:420px){.topbar .pill-btn{padding:6px 10px;font-size:.9rem}}

/* ---------- buttons: flat; only the primary button has the push style ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:44px;padding:10px 20px;border-radius:16px;border:1.5px solid transparent;font-weight:800;cursor:pointer;background:var(--acc);color:var(--text);transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .2s var(--ease);text-align:center;text-decoration:none;line-height:1.2}
.btn.primary{box-shadow:0 4px 0 var(--acc-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc-d)}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--text);border-color:var(--line2)}
.btn.purple{background:var(--purple)}
.btn.amber{background:var(--amber)}
.btn.coral{background:var(--coral)}
.btn.small{min-height:44px;padding:6px 14px;font-size:.95rem}
.btn.block{display:flex;width:100%}
.btn .badge{margin-left:auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--text2)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.back-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 8px 4px 2px;border:0;background:none;font-weight:700;color:var(--acc-ink);cursor:pointer}
.crumb{margin:-4px 0 8px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:0 0 24px}
.card.soft{background:var(--soft);box-shadow:none;border:1px solid var(--line)}
.card h2,.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700;background:var(--teal-l);color:var(--teal-ink);white-space:nowrap}
.badge.purple{background:var(--purple-l);color:var(--purple-ink)}
.badge.amber{background:var(--amber-l);color:var(--amber-ink)}
.badge.coral{background:var(--coral-l);color:var(--coral-ink)}
.badge.ok{background:var(--ok-l);color:var(--ok-ink)}
.note{background:var(--amber-l);color:var(--amber-ink);border-radius:16px;padding:12px 16px;font-weight:600}
.empty{text-align:center;padding:32px 16px;color:var(--text2)}
.empty p{max-width:36ch;margin:8px auto 0}
.page-head{display:flex;gap:16px;align-items:center;margin:0 0 24px}
.page-head h1{margin:0}
.page-head p{margin:2px 0 0}
.ph-ic{flex:0 0 52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--acc-l)}
.ph-ic.teal{background:var(--teal-l)}.ph-ic.purple{background:var(--purple-l)}.ph-ic.amber{background:var(--amber-l)}.ph-ic.coral{background:var(--coral-l)}
.unit-badge{font-weight:900;font-size:1.4rem;color:var(--teal-ink)}

/* ---------- home ---------- */
.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.home-head h1{margin:0}
.home-head p{margin:0}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--amber-l);color:var(--amber-ink);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.92rem;min-height:36px}
.continue{background:var(--acc-l);border-radius:var(--r);padding:20px;margin:0 0 8px;display:grid;gap:4px}
.continue h2{margin:0 0 8px;font-size:1.15rem}
.continue .btn{justify-self:start}
.continue.done{background:var(--ok-l)}
.unit-list{display:grid;gap:8px}
.stat-grid+.unit-row,.unit-row+.unit-row{margin-top:8px}
.unit-row{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;cursor:pointer;min-height:64px}
.unit-row.current{border:2px solid var(--teal);background:var(--teal-l)}
.unit-num{flex:0 0 40px;height:40px;border-radius:12px;background:var(--teal-l);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem}
.unit-row.current .unit-num{background:var(--teal);color:var(--text)}
.unit-row.done .unit-num{background:var(--ok-l);color:var(--ok-ink)}
.unit-info{flex:1;min-width:0;display:grid;gap:6px}
.unit-info b{font-size:1rem;font-weight:700;overflow-wrap:anywhere}
.pbar{display:block;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar.thin{height:6px}
.pbar>i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .4s var(--ease)}
.pbar.amber>i{background:var(--amber)}.pbar.coral>i{background:var(--coral)}
.stars{display:inline-flex;gap:1px;color:var(--amber-d);white-space:nowrap}
.tool-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:640px){.tool-chips{grid-template-columns:repeat(5,1fr)}}
.tool-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;min-height:88px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:.85rem;text-align:center;line-height:1.25;color:var(--text)}
.tc-ic{position:relative;width:44px;height:44px;border-radius:14px;background:var(--teal-l);color:var(--teal-ink);display:flex;align-items:center;justify-content:center}
.tc-n{position:absolute;top:-6px;right:-10px;min-width:22px;height:22px;border-radius:999px;background:var(--amber);color:var(--text);font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- unit steps and lists ---------- */
.step{margin:24px 0 0}
.step-h{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin-bottom:8px}
.step-n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem}
.set-list{display:grid;gap:8px;margin:0 0 16px}
.list-row,.set-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text);margin:0 0 8px}
.set-list .list-row,.set-list .set-row,.step .list-row{margin:0 0 6px}
.list-row>span:first-child:not(.ic){flex:1}
.sec-row .ic,.set-row .ti{flex:0 0 36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--acc-l);color:var(--acc-ink)}
.ic.teal{background:var(--teal-l)}.ic.purple{background:var(--purple-l)}.ic.amber{background:var(--amber-l)}.ic.coral{background:var(--coral-l)}
.sr-t,.set-row-t{flex:1;min-width:0;display:grid;gap:2px}
.sr-t b,.set-row-t b{font-weight:700;overflow-wrap:anywhere}
.sec-row.done,.set-row.done{background:var(--soft)}
.sec-row .tick{color:var(--ok-ink);display:inline-flex}
.sec-row.here{border:2px solid var(--teal);background:var(--teal-l)}
.set-go{color:var(--muted);display:inline-flex}
.nowrap{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:24px}
.pager .btn{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 14px}
.pager .btn:first-child{flex-shrink:0}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:999px;overflow:hidden;background:#fff}
.seg button{min-height:44px;padding:6px 16px;border:0;background:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--text)}

/* ---------- words ---------- */
.wcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:28px 20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:8px;touch-action:pan-y;user-select:none}
.wcard.know{box-shadow:var(--shadow),inset 0 0 0 2px var(--ok)}
.wcard.learn{box-shadow:var(--shadow),inset 0 0 0 2px var(--amber)}
.wcard .w{font-size:2.2rem;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.wcard .cat{align-self:center}
.wcard .def{font-size:1.05rem;max-width:40ch;margin:0 auto}
.wcard .ex,.witem .ex{font-style:italic;color:var(--text2);max-width:40ch;margin:0 auto}
.witem .ex{margin:4px 0 0}
.half-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.wlist{display:grid;gap:8px}
.witem{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:#fff}
.witem .half-btns{margin-top:10px}
.witem.learn{border-left:5px solid var(--amber)}
.witem.know{border-left:5px solid var(--ok)}

/* ---------- grammar ---------- */
.gcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 20px}
@media (min-width:600px){.gcard{padding:24px}}
.gcard .label-h:first-child{margin-top:0}
.visual{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 16px;overflow-x:auto}
.visual svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.vcap{font-size:.92rem;color:var(--text2);text-align:center;margin-top:6px}
.letters{display:grid;gap:8px}
.lrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pattern{display:grid;gap:8px;margin:8px 0 16px}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:start}
.pattern.nocue .prow{grid-template-columns:minmax(0,1fr)}
.pattern.nocue .pcue{display:none}
.pblocks{display:flex;flex-wrap:wrap;gap:6px}
.pcue{width:36px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff;border:1.5px solid var(--line2);color:var(--text2)}
.pcue.empty{border-style:dashed;border-color:var(--line)}
.prow.short .blk{background:var(--soft);border-style:dashed}
.blk{border-radius:10px;padding:6px 10px;font-weight:700;min-height:40px;display:flex;align-items:center;overflow-wrap:anywhere}
.blk.glue{margin-left:-6px;border-top-left-radius:0;border-bottom-left-radius:0}
.blk.s{background:var(--teal-l);border:1.5px solid var(--teal)}
.blk.v{background:var(--purple-l);border:1.5px solid var(--purple);color:var(--purple-ink)}
.blk.r{background:#fff;border:1.5px solid var(--line2)}
.blk.x{background:var(--amber-l);border:1.5px solid var(--amber);color:var(--amber-ink)}
.blk.n{background:var(--coral-l);border:1.5px solid var(--coral);color:var(--coral-ink)}
.examples{margin:8px 0 16px;padding:0;list-style:none}
.examples li{padding:6px 0 6px 24px;position:relative;border-bottom:1px solid var(--line)}
.examples li:last-child{border-bottom:0}
.examples li:before{content:"";position:absolute;left:4px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--purple)}
.enbox{background:var(--purple-l);border-radius:16px;padding:16px;margin:0 0 16px}
.enbox-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.enbox h4{margin:0;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--purple-ink)}
.enlines{margin:8px 0 0;padding-left:1.1em;line-height:1.55;max-width:60ch}
.enlines li{margin:4px 0;font-weight:600}
.arbox{display:none;background:#fff;border-radius:12px;padding:10px 14px;margin:12px 0 0}
.arbox.open{display:block}
.slide .arbox{background:var(--purple-l)}
.arpill{min-height:44px;min-width:44px;border-radius:999px;border:1.5px solid var(--purple);background:#fff;color:var(--purple-ink);font-weight:800;padding:4px 14px;cursor:pointer;font-size:1rem}
.arpill[aria-pressed=true]{background:var(--purple);color:var(--text)}
.watch{background:var(--coral-l);border-radius:16px;padding:16px;margin:0}
.watch h4{display:flex;align-items:center;gap:6px;color:var(--coral-ink);margin-bottom:6px}
.wr{display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 6px;align-items:baseline;padding:4px 0}
.wr .wrong-t{grid-column:1/-1;overflow-wrap:anywhere}
.wr .right-t{overflow-wrap:anywhere}
.wr .arrow{color:var(--text2)}
.wrong-t{color:var(--bad-ink);text-decoration:line-through;text-decoration-thickness:2px}
.right-t{color:var(--ok-ink);font-weight:800}
.fold{padding:4px 16px;margin:0 0 8px}
.fold-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:52px;cursor:pointer;border:0;background:none;text-align:left;color:var(--text);padding:0}
.fold-h[aria-expanded=true]{border-bottom:1px solid var(--line)}
.phrases{list-style:none;margin:0 0 8px;padding:0}
.phrases li{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.phrases li:last-child{border-bottom:0}
.vtable{width:100%;border-collapse:separate;border-spacing:4px;font-weight:800}
.vtable td,.vtable th{padding:6px 8px;border-radius:10px;text-align:center;overflow-wrap:break-word;word-break:normal;hyphens:none}
.vtable th{color:var(--text2);font-size:.85rem}
@media (max-width:600px){
  .vtable.stack,.vtable.stack tbody,.vtable.stack tr,.vtable.stack td{display:block;width:100%}
  .vtable.stack tr.vhead{display:none}
  .vtable.stack{border-spacing:0}
  .vtable.stack tr{margin-bottom:8px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:4px;overflow:hidden}
  .vtable.stack td{text-align:left;margin:0;padding:3px 8px;border-radius:8px}
  .vtable.stack td:not(:first-child){background:transparent !important;color:var(--text)}
  .vtable.stack td.empty{display:none}
  .vtable.stack td[data-h]:before{content:attr(data-h);display:inline-block;min-width:24px;margin-right:8px;font-size:.8rem;color:var(--text2);font-weight:800}
}
.vtable.verbs{table-layout:fixed;width:100%;font-size:.95rem;padding:8px}
.vtable.verbs td,.vtable.verbs th{overflow-wrap:anywhere;padding:6px 4px}
.c-teal{background:var(--teal-l)}.c-purple{background:var(--purple-l);color:var(--purple-ink)}.c-amber{background:var(--amber-l);color:var(--amber-ink)}.c-coral{background:var(--coral-l);color:var(--coral-ink)}.c-white{background:#fff;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 12px;background:#fff;border:1.5px solid var(--line2);font-weight:700;font-size:.9rem;color:var(--text2)}
.chip.on{border-color:var(--ok);color:var(--ok-ink)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chip.long{border-radius:12px}
.col-box{border-radius:14px;padding:10px;border:2px solid var(--line);background:#fff}
.col-box h4{margin-bottom:6px}

/* ---------- items ---------- */
.item{padding:4px 0}
.qline{display:flex;gap:8px;align-items:flex-start}
.qn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal-l);color:var(--teal-ink);font-weight:900;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:2px}
.qt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:1.15rem;line-height:1.5}
.gapmark{display:inline-block;min-width:64px;border-bottom:3px solid var(--purple);margin:0 4px;color:var(--purple-ink);font-weight:800;text-align:center}
.gapmark.glued{margin-left:0;min-width:0}
.cue{display:inline-flex;align-items:center;gap:4px;height:30px;border-radius:999px;background:var(--amber-l);color:var(--amber-ink);font-weight:700;font-size:.85rem;margin-left:8px;padding:0 12px;vertical-align:middle;white-space:nowrap}
.cue-ok{background:var(--ok-l);color:var(--ok-ink)}.cue-no{background:var(--bad-l);color:var(--bad-ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.opts.rows{display:grid;grid-template-columns:1fr}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;min-width:44px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;font-weight:700;cursor:pointer;text-align:left;overflow-wrap:anywhere;max-width:100%;color:var(--text)}
.abc{flex:0 0 28px;height:28px;border-radius:8px;background:var(--soft);border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:var(--text2)}
.opt.sel{border-color:var(--purple-d);background:var(--purple-l)}
.opt.sel .abc{background:var(--purple);border-color:var(--purple);color:var(--text)}
.opt.right{border-color:var(--ok);background:var(--ok-l);color:var(--ok-ink)}
.opt.right .abc{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l);color:var(--bad-ink)}
.opt[disabled]{cursor:default}
.inrow{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;align-items:center}
.inp{flex:1 1 180px;min-width:0;min-height:52px;border-radius:14px;border:1.5px solid var(--line2);padding:10px 14px;background:#fff;font-weight:600;font-size:1.1rem}
.inp:focus{outline:none;border-color:var(--purple-d);box-shadow:0 0 0 3px var(--purple-l)}
.inp.right{border-color:var(--ok);background:var(--ok-l)}
.inp.wrong{border-color:var(--bad);background:var(--bad-l)}
.hint{margin:8px 0 0;color:var(--text2);font-size:.95rem}
.spellpat{font-size:1.5rem;letter-spacing:.08em;font-weight:900;color:var(--purple-ink);white-space:pre-wrap}
.fb{margin:8px 0 0;font-weight:700;min-height:0}
.fb.ok{color:var(--ok-ink)}.fb.no{color:var(--bad-ink)}
.fb .ans,.sheet .ans{background:var(--ok-l);color:var(--ok-ink);border-radius:8px;padding:2px 8px;display:inline-block;font-weight:800}
.answer-line{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;border:1.5px dashed var(--line2);border-radius:14px;padding:6px;margin:16px 0 0;align-items:center;background:var(--soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.tile{min-height:48px;min-width:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--purple);background:var(--purple-l);font-weight:700;cursor:pointer;color:var(--text);font-size:1.05rem}
.tile.used{visibility:hidden}
.tile.tok{border-color:var(--line2);background:#fff}
.tile.tok.badsel{border-color:var(--ok);background:var(--ok-l)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board .opt{width:100%;justify-content:center;text-align:center}
.opt.matched{border-color:var(--ok);background:var(--ok-l);color:var(--ok-ink)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.bucket{border:1.5px dashed var(--purple);border-radius:14px;padding:10px;min-height:96px;background:var(--purple-l);cursor:pointer;text-align:left;font-weight:800}
.bucket .in{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bucket .in span{background:#fff;border-radius:999px;padding:2px 10px;font-size:.9rem;color:var(--ok-ink);border:1px solid var(--ok)}
.bankbar{position:sticky;top:60px;z-index:5;background:#fff;border:1.5px solid var(--purple);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.bankbar .opt{min-height:44px}
.gapbtn{display:inline-flex;min-width:80px;min-height:44px;align-items:center;justify-content:center;border-radius:10px;border:1.5px dashed var(--purple);background:#fff;font-weight:800;color:var(--purple-ink);cursor:pointer;padding:4px 10px;vertical-align:middle}
.gapbtn.active{border-style:solid;background:var(--purple-l)}
.gapbtn.right{border:1.5px solid var(--ok);background:var(--ok-l);color:var(--ok-ink)}
.gapbtn.wrong{border:1.5px solid var(--bad);background:var(--bad-l);color:var(--bad-ink)}
.pl-board .item{padding:8px 0;border-bottom:1px solid var(--line)}
.pl-board .item:last-child{border-bottom:0}
.pl-board .qt{font-size:1.05rem}
.speaker{display:inline-block;font-weight:800;color:var(--teal-ink);margin-right:6px}
.dl-line{padding:6px 0}
.score-big{font-size:2rem;font-weight:900;margin:0}
.shake{animation:shake .35s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.glow{animation:glow .7s var(--ease)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(76,175,80,.5)}100%{box-shadow:0 0 0 12px rgba(76,175,80,0)}}

/* ---------- the player ---------- */
.play-wrap{padding-bottom:120px}
.player{position:relative}
.pl-top{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.pl-top .pbar{flex:1}
.pl-count{font-weight:800;color:var(--text2);white-space:nowrap;font-size:.95rem}
.pl-instr{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--acc-ink);margin:0 0 12px}
.pl-stage{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-height:200px}
.player .item>.fb{display:none}
.player .item>.fb.cue{display:block}
.pl-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.pl-bar-in{max-width:728px;margin:0 auto;display:flex;gap:8px;justify-content:flex-end}
.pl-bar-in .btn.primary{flex:1 1 auto;max-width:360px}
.reveal-btn{display:none}
body.class-mode .reveal-btn{display:inline-flex}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .25s var(--ease)}
.sheet.on{transform:translateY(0)}
.sheet-in{max-width:760px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(45,52,54,.12);padding:20px 20px calc(16px + env(safe-area-inset-bottom));border-top:5px solid var(--line2)}
.sheet-in p{margin:4px 0 8px}
.sheet-head{display:flex;align-items:center;gap:8px;font-size:1.2rem;margin-bottom:6px}
.sheet.ok .sheet-in{border-top-color:var(--ok);background:#F6FBF6}
.sheet.ok .sheet-head{color:var(--ok-ink)}
.sheet.no .sheet-in{border-top-color:var(--bad);background:#FFF8F8}
.sheet.no .sheet-head{color:var(--bad-ink)}
.sheet.try .sheet-in{border-top-color:var(--amber);background:var(--amber-l)}
.sheet.try .sheet-head{color:var(--amber-ink)}
.sheet .btn{margin-top:8px}
.sheet.ok .btn.primary{background:var(--ok);box-shadow:0 4px 0 var(--ok-ink);color:#fff}
.sheet.no .btn.primary{background:var(--coral);box-shadow:0 4px 0 var(--coral-ink)}
.sheet.try .btn.primary{background:var(--amber);box-shadow:0 4px 0 var(--amber-d)}
.pl-end{text-align:center;padding:12px 0}
.pl-end-btns{display:grid;gap:8px;max-width:360px;margin:16px auto 0}
.confetti svg{display:block;width:100%;max-width:320px;margin:0 auto;height:auto}
.perfect .score-big{color:var(--ok-ink)}
.pl-textbtn{margin-left:auto}
.pl-split .textpanel{display:none}
.player.show-text .pl-split .textpanel{display:block}
.player.show-text .pl-split .pl-body{display:none}
@media (min-width:900px){
  .play-wrap{max-width:1100px}
  .pl-split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .pl-split .textpanel,.player.show-text .pl-split .textpanel{display:block;position:sticky;top:76px;max-height:calc(100vh - 200px);overflow:auto}
  .player.show-text .pl-split .pl-body{display:block}
  .pl-textbtn{display:none}
}
.qstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 0 12px;scrollbar-width:thin}
.qstrip button{flex:0 0 44px;height:44px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;font-weight:800;cursor:pointer;color:var(--text2)}
.qstrip button.ans{background:var(--coral-l);border-color:var(--coral);color:var(--coral-ink)}
.qstrip button.cur{outline:3px solid var(--purple-d);outline-offset:1px;color:var(--text)}
.test-intro .btn{max-width:360px}
.result-list{list-style:none;padding:0;margin:8px 0}
.result-list li{padding:10px 0;border-bottom:1px solid var(--line)}

/* ---------- reading ---------- */
.textpanel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:0 0 16px;line-height:1.65}
.textpanel p{margin:0 0 10px;max-width:62ch}
.read-lay .textpanel{display:none}.read-lay .read-q{display:none}
.read-lay.show-text .textpanel{display:block}.read-lay.show-questions .read-q{display:block}
.read-lay .read-q .label-h{margin-top:0}
.seg.only-phone{margin:0 0 16px}
@media (min-width:900px){
  .wrap:has(.read-lay){max-width:1100px}
  .read-lay{display:grid;grid-template-columns:3fr 2fr;gap:24px;align-items:start}
  .read-lay .textpanel,.read-lay .read-q{display:block}
  .seg.only-phone{display:none}
}

/* ---------- writing ---------- */
textarea.draft{width:100%;min-height:160px;border-radius:14px;border:1.5px solid var(--line2);padding:12px;resize:vertical;font-weight:500;line-height:1.55}
textarea.draft:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.model{background:var(--teal-l);border-radius:14px;padding:12px;margin-top:8px}
.checklist{list-style:none;padding:0;margin:8px 0}
.checklist li{margin:4px 0}
.ck{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer;padding:4px 8px;border-radius:10px}
.ck input{width:24px;height:24px;accent-color:var(--teal-d);flex:0 0 auto}

/* ---------- progress ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center;color:var(--text2);font-weight:600}
.stat b{display:block;font-size:1.5rem;color:var(--text)}
.set{padding:16px}
.set-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.set-head h3{margin:0;flex:1}
.set-prog{font-weight:800;color:var(--text2);font-size:.9rem;white-space:nowrap}

/* ---------- games ---------- */
.game{border-top:6px solid var(--amber)}
.game-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.timer{font-weight:900;font-size:1.3rem;color:var(--amber-ink);min-width:64px;text-align:center}
.lives{display:inline-flex;gap:2px;color:var(--coral-ink)}
.gprompt{font-size:1.25rem;font-weight:900;text-align:center;padding:12px;background:var(--amber-l);border-radius:14px;overflow-wrap:anywhere}
.gopts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:10px}
.gopts .opt{text-align:center;font-size:1.1rem;justify-content:center}
.teams{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.team{flex:1 1 140px;border-radius:14px;padding:8px 12px;border:2px solid var(--line);background:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.team.a{border-color:var(--teal);background:var(--teal-l)}
.team.b{border-color:var(--purple);background:var(--purple-l)}
.team.turn{box-shadow:0 0 0 4px rgba(255,179,71,.6)}
.teacher-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;border-radius:14px;background:#fff;border:2px dashed var(--amber);margin-top:10px}
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:600px){.mem-grid{grid-template-columns:repeat(4,1fr)}}
.mcard{min-height:84px;border-radius:14px;border:2px solid var(--amber);background:var(--amber-l);font-weight:800;cursor:pointer;padding:6px;font-size:.92rem;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--amber-d)}
.mcard.up{background:#fff;border-color:var(--purple)}
.mcard.done{background:var(--ok-l);border-color:var(--ok);color:var(--ok-ink);cursor:default;box-shadow:none}
.fall-stage{position:relative;height:340px;border-radius:16px;background:linear-gradient(#FFF8EC,#fff);border:2px solid var(--amber);overflow:hidden;margin-top:8px}
.fall-tile{position:absolute;top:0;transform:translateY(0);min-height:48px;padding:6px 6px;border-radius:12px;border:2px solid var(--purple);background:#fff;font-weight:800;font-size:.95rem;line-height:1.2;cursor:pointer;box-shadow:0 2px 0 var(--purple);will-change:transform;white-space:normal;overflow-wrap:anywhere;text-align:center;box-sizing:border-box}
.fall-floor{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--coral)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px}
.key{min-height:44px;min-width:0;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:900;cursor:pointer;text-transform:uppercase;box-shadow:0 3px 0 var(--line)}
.key.hit{background:var(--ok-l);border-color:var(--ok);color:var(--ok-ink)}
.key.miss{background:var(--bad-l);border-color:var(--bad);color:var(--bad-ink)}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.slots span{width:32px;height:40px;border-bottom:4px solid var(--purple);font-size:1.4rem;font-weight:900;text-align:center;text-transform:uppercase}
.slots span.sp{border-bottom:0}
.scene svg{display:block;width:100%;height:auto}
.hp{height:18px;border-radius:999px;background:var(--line);overflow:hidden;border:2px solid var(--coral)}
.hp>i{display:block;height:100%;background:var(--coral);transition:width .4s var(--ease)}
.result-list{list-style:none;padding:0}
.result-list li{padding:8px 0;border-bottom:1px dashed var(--line)}

/* ---------- smarter ---------- */
.slide{min-height:260px;border-radius:20px;border:2px solid var(--purple);background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}
.slide svg{max-width:320px;width:100%;height:auto;align-self:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--purple-d)}



/* ---------- puzzles ---------- */
.puzzle .game-bar{align-items:flex-start}
.pz-story{font-size:1.05rem;max-width:62ch;margin:12px 0}
.pz-hintbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}
.pz-clues{margin:0 0 12px;padding-left:1.4em}
.pz-clues li{margin:4px 0}
.clue-btn{display:block;width:100%;text-align:left;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--text);margin:0 0 6px}
.clue-btn[aria-pressed=true]{color:var(--muted);text-decoration:line-through;background:var(--soft)}
.clue-btn.on{border:2px solid var(--amber);background:var(--amber-l)}
.pz-grids{display:grid;gap:12px;margin:8px 0 16px}
@media (min-width:700px){.pz-grids{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
.pz-grid{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
.pz-grid th{font-size:.82rem;font-weight:700;color:var(--text2);text-align:center;overflow-wrap:anywhere;padding:2px}
.pz-grid th[scope=row]{text-align:left;color:var(--text);width:28%}
.pz-grid td{padding:0}
.gcell{width:100%;min-height:44px;min-width:44px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gcell.x{background:var(--bad-l);border-color:var(--bad);color:var(--bad-ink)}
.gcell.ok{background:var(--ok-l);border-color:var(--ok);color:var(--ok-ink)}
.gcell.grey{background:#EEF1F4;border-color:#EEF1F4}
.pz-final{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.pz-solved{text-align:center;background:var(--ok-l);border-radius:16px;padding:16px;margin:12px 0}
.pz-solved h3{color:var(--ok-ink);justify-content:center}
.pz-scene svg{max-width:560px;margin:0 auto 8px}
.cw-wrap{display:flex;justify-content:center;margin:8px 0}
.cw-grid{display:grid;gap:2px;width:100%}
.cw-x{aspect-ratio:1}
.cw-c{position:relative;aspect-ratio:1;background:#fff;border:1.5px solid var(--line2);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:clamp(.7rem,3.6vw,1.2rem);text-transform:uppercase}
.cw-c i{position:absolute;top:0;left:2px;font-style:normal;font-size:.55rem;font-weight:700;color:var(--text2);line-height:1.1}
.cw-c.on{background:var(--amber-l);border-color:var(--amber)}
.cw-c.right{background:var(--ok-l);border-color:var(--ok);color:var(--ok-ink)}
.cw-c.wrong{background:var(--bad-l);border-color:var(--bad);color:var(--bad-ink)}
.cw-cur{min-height:44px;background:var(--amber-l);border-radius:12px;padding:8px 12px;margin:8px 0}
.cw-clues{display:grid;gap:8px;margin-top:8px}
@media (min-width:700px){.cw-clues{grid-template-columns:1fr 1fr}}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;margin:12px 0 0}
.kb-k{min-width:44px;min-height:48px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--text)}
.kb-k.wide{grid-column:span 2;font-size:.9rem}
.kb-k.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.kb-k.near{background:var(--amber);border-color:var(--amber-d)}
.kb-k.miss{background:#DCE3E9;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:12px auto 0}
.keypad .kb-k{max-width:none}
.ws-wrap{overflow:auto;max-width:100%;padding:2px;margin:8px 0;-webkit-overflow-scrolling:touch}
.ws-grid{display:grid;gap:0;width:max-content;margin:0 auto}
.ws-c{width:44px;height:44px;border:0;background:#fff;font-weight:800;font-size:1.1rem;cursor:pointer;border-radius:8px;color:var(--text)}
.ws-c.sel{background:var(--purple);color:var(--text)}
.ws-c.found{background:var(--ok-l);color:var(--ok-ink)}
.ws-c.hinted{box-shadow:inset 0 0 0 3px var(--amber)}
.lock{background:var(--soft);border-radius:16px;padding:16px;margin:12px 0}
.lock h3{display:flex;align-items:center;gap:8px}
.lock-lines{padding-left:1.4em;margin:8px 0}
.lock-lines li{margin:6px 0;font-weight:600}
.lock-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.code-slots{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.code-slots .slot{width:44px;height:52px;border-radius:12px;border:2px solid var(--amber);background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900}
.wl-grid{display:grid;gap:6px;justify-content:center;margin:12px 0}
.wl-c{position:relative;aspect-ratio:1;min-width:0;border-radius:10px;border:2px solid var(--line2);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;text-transform:uppercase}
.wl-key .wl-c{width:28px;height:28px;font-size:.85rem;vertical-align:middle;margin:0 2px}
.wl-c.typed{border-color:var(--text2)}
.wl-c.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.wl-c.near{background:var(--amber);border-color:var(--amber-d);color:var(--text)}
.wl-c.miss{background:#DCE3E9;border-color:#DCE3E9;color:var(--text2)}
.wl-mark{position:absolute;right:4px;top:1px;font-style:normal;font-size:.75rem;line-height:1}
.riddle{background:var(--soft);border-radius:16px;padding:16px}
.rd-clues{padding-left:1.4em;font-size:1.1rem;font-weight:600}
.rd-clues li{margin:6px 0}
body.class-mode .pz-story,body.class-mode .rd-clues{font-size:1.3rem}

/* ---------- toast (above the sticky bar and the sheet) ---------- */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,40px);opacity:0;background:var(--text);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;transition:all .3s var(--ease);z-index:60;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- class mode (projector) ---------- */
@media (min-width:1100px){body.class-mode{zoom:1.25}}
@media (min-width:1500px){body.class-mode{zoom:1.45}}
@media (min-width:1900px){body.class-mode{zoom:1.75}}
body.class-mode .wrap{max-width:1040px}
body.class-mode .fall-stage{height:300px}
body.class-mode .pl-stage{text-align:center;padding:32px 24px;min-height:260px}
body.class-mode .pl-stage .qline{justify-content:center}
body.class-mode .pl-stage .qt{font-size:1.5rem;flex:0 1 auto}
body.class-mode .pl-stage .opts.rows,body.class-mode .pl-stage .opts.grid2{max-width:640px;margin-left:auto;margin-right:auto}
body.class-mode .pl-stage .tiles,body.class-mode .pl-stage .answer-line,body.class-mode .pl-stage .inrow{justify-content:center}
body.class-mode .pl-bar{position:sticky;bottom:0}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

function el(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(parent, c) {
  if (c === null || c === undefined || c === false) return parent;
  if (Array.isArray(c)) { c.forEach(function (x) { add(parent, x); }); return parent; }
  if (typeof c === 'string' || typeof c === 'number') parent.appendChild(document.createTextNode(String(c)));
  else parent.appendChild(c);

}
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

var AR_RUN = /([؀-ۿ][؀-ۿ\s،؟0-9.,!?:()'"-]*[؀-ۿ.!?])/;
/* Rich text: {word} = highlighted word; Arabic runs get their own RTL span. Never uses innerHTML. */
function rich(text) {
  var frag = document.createDocumentFragment();
  String(text).split(/(\{[^{}]+\})/).forEach(function (part) {
    if (!part) return;
    if (part.charAt(0) === '{' && part.charAt(part.length - 1) === '}') {
      frag.appendChild(el('b', { 'class': 'hl' }, part.slice(1, -1)));
      return;
    }
    part.split(AR_RUN).forEach(function (p, i) {
      if (!p) return;
      if (i % 2 === 1) frag.appendChild(el('span', { dir: 'rtl', lang: 'ar', 'class': 'ar-inline' }, p));
      else frag.appendChild(document.createTextNode(p));
    });
  });
  return frag;
}
/* An Arabic line with English words inside: each English run is isolated LTR in the English font */
function arabicLine(text) {

}

/* Same rules as buildlib/norm.py */
function norm(s) {
  s = String(s || '').toLowerCase();
  s = s.replace(/[‘’ʼ`´]/g, "'").replace(/[“”]/g, '"');
  s = s.replace(/[–—-]/g, ' ');
  s = s.replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not');
  s = s.replace(/n't\b/g, ' not');
  s = s.replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will').replace(/'d like\b/g, ' would like');
  s = s.replace(/[.,!?;:"()\u2026]/g, ' ');
  return fold(s.replace(/\s+/g, ' ').trim());

var FOLD_WORDS = { color: 'colour', colors: 'colours', favorite: 'favourite', favorites: 'favourites',
  neighbor: 'neighbour', neighbors: 'neighbours', honor: 'honour', flavor: 'flavour', behavior: 'behaviour', humor: 'humour',

  program: 'programme', programs: 'programmes', pajamas: 'pyjamas', cozy: 'cosy', practicing: 'practising', practiced: 'practised' };
function fold(s) {
  s = s.replace(/\b([a-z]{3,})iz(e|es|ed|ing|er|ers|ation|ations)\b/g, '$1is$2');

/* ===== exercises.js: items, sets, boards, test runner ===== */
var REG = {};       // item id -> live controller (test hook)
var SETREG = {};    // set id -> live set controller

function atom(it) { return (it.t === 'pair' || it.t === 'sortit' || it.t === 'bank') && it.alt ? it.alt : it; }
function rightText(it) {
  switch (it.t) {
    case 'choice': return it.o[it.a];
    case 'typed': case 'bank': return it.acc[0];
    case 'order': return it.acc[0];
    case 'fix': return it.full;
    case 'pair': return it.r;
    case 'sortit': return it.g;
    case 'lines': return it.lines.map(function (l) { return l[0] + ': ' + l[1]; }).join(' / ');
  }
  return '';
}
function promptText(it) {
  switch (it.t) {
    case 'choice': return it.q ? plain(it.q) : it.o.join(' · ');
    case 'typed': return plain(it.q) + (it.cue ? ' (' + it.cue + ')' : '');
    case 'bank': return (it.sp ? it.sp + ': ' : '') + plain(it.q);
    case 'order': return it.tiles.join(' / ');
    case 'fix': return it.tokens.join(' ');
    case 'pair': return it.l;
    case 'sortit': return it.x;
    case 'lines': return 'Put the dialogue in order';
  }
  return '';
}
function itemSource(id) {
  var m = /^a\d\du(\d+)-/.exec(id);
  return m ? 'Unit ' + m[1] : '';
}

/* ---------- recording ---------- */
function recordAttempt(id, ok, your, opts) {
  opts = opts || {};
  var r = S.items[id] || (S.items[id] = { r: 0, w: 0 });
  if (ok) r.r++; else r.w++;
  touchStreak();
  if (!ok && !opts.noMistake) {
    if (S.pile[id] === undefined) S.pile[id] = 0;
    var it = ITEMS[id];
    S.mistakes = S.mistakes.filter(function (m) { return m.id !== id; });
    S.mistakes.unshift({ id: id, your: String(your || '—').slice(0, 160), right: rightText(it), q: promptText(it).slice(0, 200), src: itemSource(id), t: Date.now() });
    if (S.mistakes.length > 300) S.mistakes.length = 300;
  }
  save();
}

/* ---------- cue pills (B5): say in words what to do ---------- */
var CUES = { '✓': ['Answer: Yes', 'check', 'ok'], '✗': ['Answer: No', 'cross', 'no'], '−': ['Make it negative', 'minus', 'neg'],
  '?': ['Make a question', 'wq', 'q'], '+': ['Make it positive', 'plus', 'pos'] };
function cuePill(c) {
  var d = CUES[c] || [c, 'choose', 'q'];
  return el('span', { 'class': 'cue cue-' + d[2] }, icon(d[1], 16), d[0]);
}

/* ---------- prompt rendering ---------- */
function promptNode(it, filled) {
  var q = it.t === 'choice' || it.t === 'typed' || it.t === 'bank' ? it.q : '';
  var span = el('span', { 'class': 'qt' });
  if (it.sp) span.appendChild(el('span', { 'class': 'speaker' }, it.sp + ':'));
  if (it.spell) { span.appendChild(el('span', { 'class': 'spellpat' }, q)); return span; }
  var parts = String(q || '').split('___');
  parts.forEach(function (p, i) {
    span.appendChild(rich(p));
    if (i < parts.length - 1) span.appendChild(el('span', { 'class': 'gapmark' }, filled || ' '));
  });
  if (it.cue) span.appendChild(cuePill(it.cue));
  return span;
}

/* Fill a gap mark; an answer like 'm or 's is glued to the word before (I'm, not I 'm) */
function fillGap(root, v) {
  var g = root.querySelector('.gapmark');
  if (!g) return;
  g.textContent = v;
  var prev = g.previousSibling;
  var glue = /^'(m|s|re|ve|ll|d)\b/.test(String(v));
  g.classList.toggle('glued', glue);
  if (prev && prev.nodeType === 3) {
    if (glue && /\s$/.test(prev.textContent)) { g.dataset.sp = '1'; prev.textContent = prev.textContent.replace(/\s+$/, ''); }
    else if (!glue && g.dataset.sp) { prev.textContent += ' '; delete g.dataset.sp; }
  }
}

/* ---------- single item controller ---------- */
function makeItem(id, num, mode, onDone, hooks) {
  var raw = ITEMS[id];
  var it = mode === 'practice' || mode === 'player' ? raw : atom(raw);
  var test = mode === 'test';
  // player mode: the answer is checked from the sticky Check bar, feedback goes to the sheet
  var deferred = mode === 'player';
  hooks = hooks || {};
  var root = el('div', { 'class': 'item', 'data-id': id });
  var ctl = { id: id, node: root, done: false, score: 0, tries: 0, item: it, ready: function () { return false; }, check: function () {} };
  var maxTries = test ? 1 : (it.t === 'choice' ? (it.o.length > 2 ? 2 : 1) : 2);
  var fb = el('div', { 'class': 'fb', 'aria-live': 'polite' });
  var qline = el('div', { 'class': 'qline' }, num ? el('span', { 'class': 'qn' }, String(num)) : null);
  root.appendChild(qline);

  function finish(ok, your, revealed) {
    ctl.done = true;
    ctl.score = ok ? (ctl.tries <= 1 ? 1 : 0.5) : 0;
    if (!test && !revealed && ok) recordAttempt(id, true, your, { noMistake: true }); // wrong tries were already recorded in wrongTry (B4)
    if (ok) { fb.className = 'fb ok'; fb.textContent = ctl.tries <= 1 ? 'Great!' : 'Yes, good.'; anim(root, 'glow'); }
    else { fb.className = 'fb no'; clear(fb); fb.appendChild(document.createTextNode(revealed ? 'Answer: ' : 'The answer is: ')); fb.appendChild(el('span', { 'class': 'ans' }, rightText(it))); }
    if (onDone) onDone(ctl);
  }
  function wrongTry(your, node) {
    ctl.tries++;
    if (!test) recordAttempt(id, false, your);
    anim(node || root, 'shake');
    if (ctl.tries >= maxTries) { finish(false, your); return true; }
    fb.className = 'fb no'; fb.textContent = 'Not quite. Try again.';
    if (hooks.onTry) hooks.onTry(ctl);
    return false;
  }

  if (it.t === 'choice') {
    if (it.q || it.sp) qline.appendChild(promptNode(it));
    else qline.appendChild(el('span', { 'class': 'qt' }, 'Find the odd one.'));
    var rows = deferred || test;
    var short = it.o.every(function (o) { return plain(o).length <= 12; });
    var opts = el('div', { 'class': 'opts' + (rows ? (short ? ' grid2' : ' rows') : '') });
    var btns = it.o.map(function (o, i) {
      var b = el('button', { 'class': 'opt', type: 'button', onclick: function () { pick(i); } }, rows ? el('span', { 'class': 'abc', 'aria-hidden': 'true' }, 'ABCDEF'.charAt(i)) : null, rich(o));
      opts.appendChild(b); return b;
    });
    root.appendChild(opts);
    var chosen = null, checking = false;
    function pick(i) {
      if (ctl.done) return;
      if (test || (deferred && !checking)) { if (btns[i].disabled) return; chosen = i; btns.forEach(function (b, k) { b.classList.toggle('sel', k === i); }); ctl.answered = true; if (hooks.onChange) hooks.onChange(); return; }
      btns.forEach(function (b) { b.classList.remove('sel'); });
      if (i === it.a) {
        ctl.tries++;
        btns[i].classList.add('right');
        btns.forEach(function (b) { b.disabled = true; });
        setGap(it.o[i]);
        finish(true, it.o[i]);
        if (it.fb) fb.appendChild(el('div', { 'class': 'sec small-t' }, rich(it.fb)));
      } else {
        btns[i].classList.add('wrong'); btns[i].disabled = true;
        if (wrongTry(it.o[i], btns[i])) { btns[it.a].classList.add('right'); btns.forEach(function (b) { b.disabled = true; }); setGap(it.o[it.a]); if (it.fb) fb.appendChild(el('div', { 'class': 'sec small-t' }, rich(it.fb))); }
      }
    }
    ctl.ready = function () { return chosen !== null; };
    ctl.check = function () { if (chosen === null) return; var c = chosen; chosen = null; checking = true; pick(c); checking = false; };
    ctl.autoAnswer = function (ok) {
      if (ok) pick(it.a);
      else { var w = it.o.map(function (_, k) { return k; }).filter(function (k) { return k !== it.a && !btns[k].disabled; })[0]; pick(w); }
      if (deferred) ctl.check();
    };
    ctl.result = function () { return { ok: chosen === it.a, your: chosen === null ? '—' : it.o[chosen] }; };
    ctl.reveal = function () { if (ctl.done) return; btns[it.a].classList.add('right'); btns.forEach(function (b) { b.disabled = true; }); setGap(it.o[it.a]); finish(false, null, true); };
  } else if (it.t === 'typed') {
    qline.appendChild(promptNode(it));
    if (it.spell && it.hint) root.appendChild(el('div', { 'class': 'hint' }, rich(it.hint)));
    else if (it.hint) root.appendChild(el('div', { 'class': 'hint' }, 'Starts with: ', el('b', null, it.hint)));
    var inp = el('input', { 'class': 'inp', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Your answer' });
    var chk = el('button', { 'class': 'btn small', type: 'button' }, 'Check');
    var row = el('div', { 'class': 'inrow' }, inp, test || deferred ? null : chk);
    root.appendChild(row);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !test) { e.preventDefault(); if (deferred && hooks.submit) hooks.submit(); else check(); } });
    inp.addEventListener('input', function () { ctl.answered = !!inp.value.trim(); });
    chk.addEventListener('click', check);
    function check() {
      if (ctl.done) return;
      var v = inp.value;
      if (!v.trim()) { inp.focus(); return; }

    }

var ACTIVE_LOOPS = [];

/* rAF for smooth frames + a setTimeout watchdog: rAF stops in hidden tabs, the watchdog keeps state moving */
function gameLoop(step) {
  var alive = true, last = performance.now(), lastRun = last;
  function run(now) {
    var dt = Math.min(120, Math.max(0, now - last));

  function watchdog() { if (!alive) return; var now = performance.now(); if (now - lastRun > 150) run(now); setTimeout(watchdog, 120); }
  requestAnimationFrame(frame); setTimeout(watchdog, 120);
  var l = { stop: function () { alive = false; } };
  ACTIVE_LOOPS.push(l);
  return l;
}

    if (p[2] === 'games' && p[3]) { S.last = h; save(); return pageGame(U, p[3]); }

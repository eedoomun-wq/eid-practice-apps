:root{
  --teal:#2EC4B6;--teal-d:#22A99D;--teal-l:#E8FAF8;--teal-ink:#166F68;
  --coral:#FF6B6B;--coral-l:#FFF0F0;--coral-ink:#C23B3B;
  --amber:#FFB347;--amber-l:#FFF8EC;--amber-ink:#8A5300;--amber-d:#E89A2E;
  --purple:#A78BFA;--purple-d:#7C5CE8;--purple-l:#F3EFFF;--purple-ink:#6D4FD1;
  --ok:#4CAF50;--ok-ink:#388E3C;--ok-l:#EAF6EA;--bad:#EF5350;--bad-ink:#C62828;--bad-l:#FDECEC;
  --text:#2D3436;--text2:#636E72;--muted:#798D96;
  --bg:#F5F7FA;--card:#FFFFFF;--soft:#FAFAFA;--line:#E3E8EE;
  --r:18px;--r-sm:12px;--shadow:0 2px 10px rgba(45,52,54,.07),0 1px 2px rgba(45,52,54,.05);
  --ease:cubic-bezier(.4,0,.2,1);
  --font:'Nunito','Varela Round',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ar:"Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.25;font-weight:900}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
p{margin:0 0 8px}
a{color:var(--teal-ink)}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:16px 16px 32px}
main{flex:1;outline:none}
.foot{text-align:center;color:var(--text2);font-size:.85rem;padding:16px 16px 24px}
[dir=rtl][lang=ar] .en{font-family:var(--font);font-weight:800;color:var(--purple-ink);unicode-bidi:isolate}
[dir=rtl][lang=ar],.ar{font-family:var(--ar);direction:rtl;text-align:right;line-height:1.9;font-size:1.08rem}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-bottom:3px solid var(--teal);padding:6px 12px;box-shadow:0 1px 6px rgba(45,52,54,.06)}
.top-home{display:flex;align-items:center;gap:8px;background:none;border:0;font-weight:900;font-size:1.1rem;min-height:44px;padding:4px 8px;border-radius:12px;cursor:pointer}
.top-home:focus-visible,.btn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px}
.logo-dot{width:22px;height:22px;border-radius:50%;background:var(--teal);box-shadow:inset -4px -4px 0 var(--teal-d)}
.pill-btn{min-height:44px;min-width:44px;border-radius:999px;border:2px solid var(--line);background:#fff;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--text2)}
.pill-btn[aria-pressed=true]{background:var(--teal);border-color:var(--teal-d);color:var(--text)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:8px 18px;border-radius:14px;border:0;font-weight:800;cursor:pointer;background:var(--teal);color:var(--text);box-shadow:0 4px 0 var(--teal-d);transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .2s var(--ease);text-align:center;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--text);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn.amber{background:var(--amber);box-shadow:0 4px 0 var(--amber-d)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-ink)}
.btn.small{min-height:44px;padding:6px 12px;font-size:.95rem}
.btn.block{display:flex;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 16px;border:1px solid var(--line)}
.card.soft{background:var(--soft)}
.card h2,.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:800;background:var(--teal-l);color:var(--teal-ink);white-space:nowrap}
.badge.purple{background:var(--purple-l);color:var(--purple-ink)}
.badge.amber{background:var(--amber-l);color:var(--amber-ink)}
.badge.coral{background:var(--coral-l);color:var(--coral-ink)}
.badge.ok{background:var(--ok-l);color:var(--ok-ink)}
.muted{color:var(--muted)}.sec{color:var(--text2)}
.small-t{font-size:.9rem}
.hl{font-weight:900;color:var(--purple-ink)}
.hero{border-radius:20px;padding:20px 16px;background:var(--teal-l);border:2px solid var(--teal);margin-bottom:16px}
.hero h1{font-size:1.8rem}
.accent-teal{border-top:6px solid var(--teal)}.accent-purple{border-top:6px solid var(--purple)}
.accent-amber{border-top:6px solid var(--amber)}.accent-coral{border-top:6px solid var(--coral)}
.sec-head{border-radius:20px;padding:14px 16px;margin-bottom:16px;border:2px solid var(--line);background:#fff}
.sec-head.teal{background:var(--teal-l);border-color:var(--teal)}
.sec-head.purple{background:var(--purple-l);border-color:var(--purple)}
.sec-head.amber{background:var(--amber-l);border-color:var(--amber)}
.sec-head.coral{background:var(--coral-l);border-color:var(--coral)}
.sec-head h1{font-size:1.4rem;margin:0}
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

/* ---------- home ---------- */
.unit-list{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.unit-list{grid-template-columns:1fr 1fr}}
.unit-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:0 4px 0 var(--line);min-height:64px;transition:transform .12s var(--ease)}
.unit-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.unit-num{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--teal);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem}
.unit-info{flex:1;min-width:0}
.unit-info b{display:block;font-size:1.05rem}
.stars{color:var(--amber-ink);font-size:1.1rem;letter-spacing:2px;white-space:nowrap}
.big-cards{display:grid;gap:12px;grid-template-columns:1fr;margin-top:16px}
@media (min-width:700px){.big-cards{grid-template-columns:repeat(3,1fr)}}
.big-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;width:100%;border-radius:20px;padding:16px;cursor:pointer;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);min-height:100px}
.big-card.purple{background:var(--purple-l);border-color:var(--purple)}
.big-card.teal{background:var(--teal-l);border-color:var(--teal)}
.big-card.amber{background:var(--amber-l);border-color:var(--amber)}
.big-card.coral{background:var(--coral-l);border-color:var(--coral)}
.big-card b{font-size:1.15rem}
.tool-grid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (min-width:700px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
.tool{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left;font-weight:800;box-shadow:0 3px 0 var(--line)}
.tool .cnt{margin-left:auto}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--amber-l);border:2px solid var(--amber);color:var(--amber-ink);padding:4px 12px;border-radius:999px;font-weight:900}
.gi-unit{margin-bottom:12px}
.gi-link{display:flex;width:100%;text-align:left;min-height:44px;align-items:center;padding:6px 12px;border-radius:12px;border:0;background:var(--purple-l);color:var(--purple-ink);font-weight:800;margin:4px 0;cursor:pointer}

/* ---------- unit sections grid ---------- */
.sec-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (min-width:700px){.sec-grid{grid-template-columns:repeat(3,1fr)}}
.sec-btn{display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:800;box-shadow:0 3px 0 var(--line)}
.sec-btn .ic{flex:0 0 36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sec-btn.done{border-color:var(--ok)}
.sec-btn .tick{margin-left:auto;color:var(--ok-ink);font-weight:900}
.ic.teal{background:var(--teal-l)}.ic.purple{background:var(--purple-l)}.ic.amber{background:var(--amber-l)}.ic.coral{background:var(--coral-l)}
.pager{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---------- words ---------- */
.wcard{border:2px solid var(--purple);background:#fff;border-radius:20px;padding:16px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.wcard .w{font-size:1.8rem;font-weight:900;color:var(--text);overflow-wrap:anywhere}
.wcard .cat{align-self:center}
.wlist{display:grid;gap:8px}
.witem{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.witem b{font-size:1.05rem}
.witem.learn{border-left:6px solid var(--amber)}
.witem.know{border-left:6px solid var(--ok)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{min-height:44px;padding:6px 14px;border:0;background:#fff;font-weight:800;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--purple);color:var(--text)}

/* ---------- grammar ---------- */
.gcard{border-top:6px solid var(--purple)}
.visual{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0 12px;overflow:hidden}
.visual svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.vcap{font-size:.92rem;color:var(--text2);text-align:center;margin-top:6px}
.pattern{display:grid;gap:8px;margin:8px 0}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.pcue{flex:0 0 36px;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff;border:2px solid var(--line)}
.blk{border-radius:10px;padding:6px 10px;font-weight:800;min-height:40px;display:flex;align-items:center;overflow-wrap:anywhere}
.blk.s{background:var(--teal-l);border:2px solid var(--teal)}
.blk.v{background:var(--purple-l);border:2px solid var(--purple);color:var(--purple-ink)}
.blk.r{background:#fff;border:2px solid var(--line)}
.blk.x{background:var(--amber-l);border:2px solid var(--amber);color:var(--amber-ink)}
.blk.n{background:var(--coral-l);border:2px solid var(--coral);color:var(--coral-ink)}
.examples{margin:8px 0;padding:0;list-style:none}
.examples li{padding:6px 0 6px 28px;position:relative;border-bottom:1px dashed var(--line)}
.examples li:before{content:"";position:absolute;left:6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--purple)}
.arbox{background:var(--purple-l);border-radius:14px;padding:10px 14px;margin:12px 0}
.watch{background:var(--coral-l);border:2px solid var(--coral);border-radius:14px;padding:10px 14px;margin:12px 0}
.watch h4{color:var(--coral-ink);margin-bottom:4px}
.wr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:4px 0}
.wrong-t{color:var(--bad-ink);text-decoration:line-through;text-decoration-thickness:2px}
.right-t{color:var(--ok-ink);font-weight:800}
.vtable{width:100%;border-collapse:separate;border-spacing:4px;font-weight:800}
.vtable td,.vtable th{padding:6px 8px;border-radius:10px;text-align:center;overflow-wrap:break-word;word-break:normal;hyphens:none}
.vtable th{color:var(--text2);font-size:.85rem}
.c-teal{background:var(--teal-l)}.c-purple{background:var(--purple-l);color:var(--purple-ink)}.c-amber{background:var(--amber-l);color:var(--amber-ink)}.c-coral{background:var(--coral-l);color:var(--coral-ink)}.c-white{background:#fff;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:4px 12px;background:#fff;border:2px solid var(--line);font-weight:800}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col-box{border-radius:14px;padding:10px;border:2px solid var(--line);background:#fff}
.col-box h4{margin-bottom:6px}

/* ---------- exercises ---------- */
.set{border-top:6px solid var(--teal)}
.set-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.set-head .ti{flex:0 0 36px;height:36px;border-radius:10px;background:var(--teal-l);display:flex;align-items:center;justify-content:center}
.set-head h3{margin:0;flex:1;font-size:1.08rem}
.set-prog{font-weight:800;color:var(--text2);font-size:.9rem;white-space:nowrap}
.item{padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.qline{display:flex;gap:8px;align-items:flex-start}
.qn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--teal-l);color:var(--teal-ink);font-weight:900;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:2px}
.qt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.gapmark{display:inline-block;min-width:64px;border-bottom:3px solid var(--purple);margin:0 4px;color:var(--purple-ink);font-weight:900;text-align:center}
.cue{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:28px;border-radius:8px;background:var(--amber-l);color:var(--amber-ink);font-weight:900;margin-left:6px;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 36px}
.opt{min-height:44px;min-width:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line);text-align:left;overflow-wrap:anywhere;max-width:100%}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--purple);background:var(--purple-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l);color:var(--ok-ink);box-shadow:0 0 0 4px rgba(76,175,80,.18)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l);color:var(--bad-ink)}
.opt[disabled]{cursor:default}
.inrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 36px;align-items:center}
.inp{flex:1 1 180px;min-width:0;min-height:44px;border-radius:12px;border:2px solid var(--line);padding:8px 12px;background:#fff;font-weight:700}
.inp:focus{outline:none;border-color:var(--purple)}
.inp.right{border-color:var(--ok);background:var(--ok-l)}
.inp.wrong{border-color:var(--bad);background:var(--bad-l)}
.hint{margin:6px 0 0 36px;color:var(--text2);font-size:.92rem}
.spellpat{font-size:1.4rem;letter-spacing:.08em;font-weight:900;color:var(--purple-ink);white-space:pre-wrap}
.fb{margin:6px 0 0 36px;font-weight:800;min-height:0}
.fb.ok{color:var(--ok-ink)}.fb.no{color:var(--bad-ink)}
.fb .ans{background:var(--ok-l);color:var(--ok-ink);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:2px}
.answer-line{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:4px;margin:8px 0 0 36px;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 36px}
.tile{min-height:44px;min-width:44px;padding:6px 12px;border-radius:12px;border:2px solid var(--purple);background:var(--purple-l);font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--purple);color:var(--text)}
.tile.used{visibility:hidden}
.tile.tok{border-color:var(--line);background:#fff;box-shadow:0 3px 0 var(--line)}
.tile.tok.badsel{border-color:var(--ok);background:var(--ok-l)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board .opt{width:100%}
.opt.matched{border-color:var(--ok);background:var(--ok-l);color:var(--ok-ink)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.bucket{border:2px dashed var(--purple);border-radius:14px;padding:8px;min-height:88px;background:var(--purple-l);cursor:pointer;text-align:left;font-weight:800}
.bucket .in{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bucket .in span{background:#fff;border-radius:999px;padding:2px 10px;font-size:.9rem;color:var(--ok-ink);border:1px solid var(--ok)}
.bankbar{position:sticky;top:64px;z-index:5;background:#fff;border:2px solid var(--purple);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.gapbtn{display:inline-flex;min-width:80px;min-height:44px;align-items:center;justify-content:center;border-radius:10px;border:2px dashed var(--purple);background:#fff;font-weight:900;color:var(--purple-ink);cursor:pointer;padding:4px 10px;vertical-align:middle}
.gapbtn.active{border-style:solid;background:var(--purple-l)}
.gapbtn.right{border:2px solid var(--ok);background:var(--ok-l);color:var(--ok-ink)}
.gapbtn.wrong{border:2px solid var(--bad);background:var(--bad-l);color:var(--bad-ink)}
.speaker{display:inline-block;font-weight:900;color:var(--teal-ink);margin-right:6px}
.dl-line{padding:6px 0}
.setfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.score-big{font-size:1.2rem;font-weight:900}
.shake{animation:shake .35s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.glow{animation:glow .7s var(--ease)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(76,175,80,.5)}100%{box-shadow:0 0 0 12px rgba(76,175,80,0)}}
.reveal-bar{display:none}
body.class-mode .reveal-bar{display:flex}
.x-hide{display:none !important}

/* ---------- reading ---------- */
.textpanel{position:sticky;top:60px;z-index:4;max-height:42vh;overflow:auto;background:#fff;border:2px solid var(--teal);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.textpanel p{margin:0 0 6px}

/* ---------- writing ---------- */
textarea.draft{width:100%;min-height:160px;border-radius:14px;border:2px solid var(--line);padding:12px;resize:vertical;font-weight:600;line-height:1.5}
textarea.draft:focus{outline:none;border-color:var(--teal)}
.model{background:var(--teal-l);border-radius:14px;padding:12px;margin-top:8px}
.checklist{list-style:none;padding:0;margin:8px 0}
.checklist li{margin:4px 0}
.ck{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer;padding:4px 8px;border-radius:10px}
.ck input{width:24px;height:24px;accent-color:var(--teal-d);flex:0 0 auto}

/* ---------- progress ---------- */
.pbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .4s var(--ease)}
.pbar.amber>i{background:var(--amber)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem}

/* ---------- games ---------- */
.game{border-top:6px solid var(--amber)}
.game-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.timer{font-weight:900;font-size:1.3rem;color:var(--amber-ink);min-width:64px;text-align:center}
.lives{font-size:1.2rem;color:var(--coral-ink);letter-spacing:2px}
.gprompt{font-size:1.25rem;font-weight:900;text-align:center;padding:12px;background:var(--amber-l);border-radius:14px;overflow-wrap:anywhere}
.gopts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:10px}
.gopts .opt{text-align:center;font-size:1.1rem;justify-content:center}
.teams{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.team{flex:1 1 140px;border-radius:14px;padding:8px 12px;border:2px solid var(--line);background:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.team.a{border-color:var(--teal);background:var(--teal-l)}
.team.b{border-color:var(--purple);background:var(--purple-l)}
.team.turn{box-shadow:0 0 0 4px rgba(255,179,71,.6)}
.teacher-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;border-radius:14px;background:#fff;border:2px dashed var(--amber);margin-top:10px}
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:600px){.mem-grid{grid-template-columns:repeat(4,1fr)}}
.mcard{min-height:84px;border-radius:14px;border:2px solid var(--amber);background:var(--amber-l);font-weight:800;cursor:pointer;padding:6px;font-size:.92rem;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--amber-d)}
.mcard.up{background:#fff;border-color:var(--purple)}
.mcard.done{background:var(--ok-l);border-color:var(--ok);color:var(--ok-ink);cursor:default;box-shadow:none}
.fall-stage{position:relative;height:340px;border-radius:16px;background:linear-gradient(#FFF8EC,#fff);border:2px solid var(--amber);overflow:hidden;margin-top:8px}
.fall-tile{position:absolute;top:0;transform:translateY(0);min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--purple);background:#fff;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--purple);will-change:transform;max-width:46%;min-width:48px}
.fall-floor{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--coral)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px}
.key{min-height:44px;min-width:0;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:900;cursor:pointer;text-transform:uppercase;box-shadow:0 3px 0 var(--line)}
.key.hit{background:var(--ok-l);border-color:var(--ok);color:var(--ok-ink)}
.key.miss{background:var(--bad-l);border-color:var(--bad);color:var(--bad-ink)}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.slots span{width:32px;height:40px;border-bottom:4px solid var(--purple);font-size:1.4rem;font-weight:900;text-align:center;text-transform:uppercase}
.slots span.sp{border-bottom:0}
.scene svg{display:block;width:100%;height:auto}
.hp{height:18px;border-radius:999px;background:var(--line);overflow:hidden;border:2px solid var(--coral)}
.hp>i{display:block;height:100%;background:var(--coral);transition:width .4s var(--ease)}
.result-list{list-style:none;padding:0}
.result-list li{padding:8px 0;border-bottom:1px dashed var(--line)}

/* ---------- smarter ---------- */
.slide{min-height:260px;border-radius:20px;border:2px solid var(--purple);background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}
.slide svg{max-width:320px;width:100%;height:auto;align-self:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--purple-d)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,40px);opacity:0;background:var(--text);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;transition:all .3s var(--ease);z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- class mode (projector) ---------- */
@media (min-width:1100px){body.class-mode{zoom:1.25}}
@media (min-width:1500px){body.class-mode{zoom:1.45}}
@media (min-width:1900px){body.class-mode{zoom:1.75}}
body.class-mode .wrap{max-width:1040px}
body.class-mode .fall-stage{height:300px}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

w words fast. A short review the next day, and again a few days later, keeps them.","v":"curve"},{"h":"A daily habit","t":"Choose a fixed time: after breakfast, on the service taxi, before bed. Same time, every day.","v":"calendar"},{"h":"Keep your streak","t":"The flame on the Home screen counts your days in a row. Try not to break it!","v":"streak"}]},{"id":"mistakes","title":"Love your mistakes","icon":"pencil","summary":"Mistakes show you what to learn next.","slides":[{"h":"Everyone makes mistakes","t":"Mistakes are normal. They show your brain is working on a new rule.","v":"smile"},{"h":"Your Mistake Notebook","t":"The app saves your wrong answers with the right answers. Read them before a test.","v":"notebook"},{"h":"Find your pattern","t":"Is it always the same mistake? For example, 'He go' instead of 'He goes'? Write it on a card and look at it every day.","v":"pattern"}]},{"id":"chunks","title":"Learn chunks, not single words","icon":"blocks","summary":"Learn words together with their friends.","slides":[{"h":"Words have friends","t":"Don't learn only 'homework'. Learn 'do my homework'. Don't learn only 'photo'. Learn 'take a photo'.","v":"chunks"},{"h":"Copy whole sentences","t":"When you read a useful sentence, write the full sentence in your notebook.","v":"notebook"},{"h":"Use them today","t":"Say your new chunk three times today: in class, at home, in a message to a friend.","v":"three"}]},{"id":"arabic","title":"Arabic can help — and trick you","icon":"bridge","summary":"Notice where English and Arabic are different.","slides":[{"h":"No 'is' in Arabic","t":"In Arabic we say 'أنا طالب' with no verb. In English you need it: 'I am a student.'","v":"slots"},{"h":"Age","t":"In Arabic: 'عمري 20 سنة'. In English: 'I'm 20', not 'I have 20 years'.","v":"swap"},{"h":"Make a 'trap list'","t":"Write the sentences where Arabic tricks you. Check the list before you write or speak.","v":"list"}]},{"id":"speak","title":"Talk to yourself in English","icon":"chat","s <script>
/* ===== util.js: DOM helpers, text, storage, icons ===== */
'use strict';
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var ITEMS = DATA.items;

function el(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(parent, c) {
  if (c === null || c === undefined || c === false) return parent;
  if (Array.isArray(c)) { c.forEach(function (x) { add(parent, x); }); return parent; }
  if (typeof c === 'string' || typeof c === 'number') parent.appendChild(document.createTextNode(String(c)));
  else parent.appendChild(c);
  return parent;
}
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

var AR_RUN = /([؀-ۿ][؀-ۿ\s،؟0-9.,!?:()'"-]*[؀-ۿ.!?])/;
/* Rich text: {word} = highlighted word; Arabic runs get their own RTL span. Never uses innerHTML. */
function rich(text) {
  var frag = document.createDocumentFragment();
  String(text).split(/(\{[^{}]+\})/).forEach(function (part) {
    if (!part) return;
    if (part.charAt(0) === '{' && part.charAt(part.length - 1) === '}') {
      frag.appendChild(el('b', { 'class': 'hl' }, part.slice(1, -1)));
      return;
    }
    part.split(AR_RUN).forEach(function (p, i) {
      if (!p) return;
      if (i % 2 === 1) frag.appendChild(el('span', { dir: 'rtl', lang: 'ar', 'class': 'ar-inline' }, p));
      else frag.appendChild(document.createTextNode(p));
    });
  });
  return frag;
}
/* An Arabic line with English words inside: each English run is isolated LTR in the English font */
function arabicLine(text) {
  var d = el('div');
  String(text).split(/([A-Za-z](?:[A-Za-z0-9'’.,…?!=\/+\- ]*[A-Za-z0-9'’?!…])?)/).forEach(function (p, i) {
    if (!p) return;
    if (i % 2 === 1) d.appendChild(el('span', { 'class': 'en', dir: 'ltr', lang: 'en' }, p));
    else d.appendChild(document.createTextNode(p));
  });
  return d;
}
function plain(text) { return String(text).replace(/[{}]/g, ''); }

/* Same rules as buildlib/norm.py */
function norm(s) {
  s = String(s || '').toLowerCase();
  s = s.replace(/[‘’ʼ`´]/g, "'").replace(/[“”]/g, '"');
  s = s.replace(/[–—-]/g, ' ');
  s = s.replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not');
  s = s.replace(/n't\b/g, ' not');
  s = s.replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will').replace(/'d like\b/g, ' would like');
  s = s.replace(/[.,!?;:"()…]/g, ' ');
  return s.replace(/\s+/g, ' ').trim();
}
function matches(input, acc) {
  var n = norm(input);
  if (!n) return false;
  for (var i = 0; i < acc.length; i++) if (norm(acc[i]) === n) return true;
  return false;
}

/* ---------- storage: one key per app, every access wrapped ---------- */
var STORE_OK = true;
function defaultState() {
  return { v: 1, words: {}, items: {}, pile: {}, mistakes: [], sets: {}, tests: {}, secs: {}, streak: { last: null, count: 0 },
           last: null, cando: {}, drafts: {}, games: {}, classMode: false, slides: {}, wordsView: 'cards' };
}
function loadState() {
  var s = null;
  try { var raw = window.localStorage.getItem(DATA.storageKey); if (raw) s = JSON.parse(raw); } catch (e) { STORE_OK = false; s = null; }
  var d = defaultState();
  if (s && typeof s === 'object') for (var k in d) if (s[k] !== undefined) d[k] = s[k];
  return d;
}
var S = loadState();
var saveTimer = null;
function save(now) {

/* ===== exercises.js: items, sets, boards, test runner ===== */
var REG = {};       // item id -> live controller (test hook)
var SETREG = {};    // set id -> live set controller

function atom(it) { return (it.t === 'pair' || it.t === 'sortit' || it.t === 'bank') && it.alt ? it.alt : it; }
function rightText(it) {
  switch (it.t) {
    case 'choice': return it.o[it.a];
    case 'typed': case 'bank': return it.acc[0];
    case 'order': return it.acc[0];
    case 'fix': return it.full;
    case 'pair': return it.r;
    case 'sortit': return it.g;
    case 'lines': return it.lines.map(function (l) { return l[0] + ': ' + l[1]; }).join(' / ');
  }
  return '';
}
function promptText(it) {
  switch (it.t) {
    case 'choice': return it.q ? plain(it.q) : it.o.join(' · ');
    case 'typed': return plain(it.q) + (it.cue ? ' (' + it.cue + ')' : '');
    case 'bank': return (it.sp ? it.sp + ': ' : '') + plain(it.q);
    case 'order': return it.tiles.join(' / ');
    case 'fix': return it.tokens.join(' ');
    case 'pair': return it.l;
    case 'sortit': return it.x;
    case 'lines': return 'Put the dialogue in order';
  }
  return '';
}
function itemSource(id) {
  var m = /^a\d\du(\d+)-/.exec(id);
  return m ? 'Unit ' + m[1] : '';
}

/* ---------- recording ---------- */
function recordAttempt(id, ok, your, opts) {
  opts = opts || {};
  var r = S.items[id] || (S.items[id] = { r: 0, w: 0 });
  if (ok) r.r++; else r.w++;
  touchStreak();
  if (!ok && !opts.noMistake) {
    if (S.pile[id] === undefined) S.pile[id] = 0;
    var it = ITEMS[id];
    S.mistakes = S.mistakes.filter(function (m) { return m.id !== id; });
    S.mistakes.unshift({ id: id, your: String(your || '—').slice(0, 160), right: rightText(it), q: promptText(it).slice(0, 200), src: itemSource(id), t: Date.now() });
    if (S.mistakes.length > 300) S.mistakes.length = 300;
  }
  save();
}

/* ---------- prompt rendering ---------- */
function promptNode(it, filled) {
  var q = it.t === 'choice' || it.t === 'typed' || it.t === 'bank' ? it.q : '';
  var span = el('span', { 'class': 'qt' });
  if (it.sp) span.appendChild(el('span', { 'class': 'speaker' }, it.sp + ':'));
  if (it.spell) { span.appendChild(el('span', { 'class': 'spellpat' }, q)); return span; }
  var parts = String(q || '').split('___');
  parts.forEach(function (p, i) {
    span.appendChild(rich(p));
    if (i < parts.length - 1) span.appendChild(el('span', { 'class': 'gapmark' }, filled || ' '));
  });
  if (it.cue) span.appendChild(el('span', { 'class': 'cue', title: 'Change the sentence' }, it.cue));
  return span;
}

/* ---------- single item controller ---------- */
function makeItem(id, num, mode, onDone) {
  var raw = ITEMS[id];

  if (set.k === 'match' || set.k === 'sort' || set.k === 'bank') {

var ACTIVE_LOOPS = [];
function stopAllLoops() { ACTIVE_LOOPS.forEach(function (l) { l.stop(); }); ACTIVE_LOOPS = []; }

/* rAF for smooth frames + a setTimeout watchdog: rAF stops in hidden tabs, the watchdog keeps state moving */
function gameLoop(step) {
  var alive = true, last = performance.now(), lastRun = last;
  function run(now) {
    var dt = Math.min(120, Math.max(0, now - last));
    last = now; lastRun = now;
    if (document.hidden) return;
    step(dt);
  }
  function frame(now) { if (!alive) return; run(now); requestAnimationFrame(frame); }
  function watchdog() { if (!alive) return; var now = performance.now(); if (now - lastRun > 150) run(now); setTimeout(watchdog, 120); }
  requestAnimationFrame(frame); setTimeout(watchdog, 120);
  var l = { stop: function () { alive = false; } };
  ACTIVE_LOOPS.push(l);
  return l;
}

var GAMES = {};

GAMES.memory = function (ctx, U) {
  var pool = shuffled(U.games.memory), pairs = [], usedSyn = {}, seen = {};
  for (var i = 0; i < pool.length && pairs.length < 6; i++) {
    var p = pool[i];
    if ((p[2] && usedSyn[p[2]]) || seen[norm(p[0])] || seen[norm(p[1])]) continue;
    if (p[2]) usedSyn[p[2]] = 1;
    seen[norm(p[0])] = 1; seen[norm(p[1])] = 1; pairs.push(p);
  }
  var cards = [];
  pairs.forEach(function (p, k) { cards.push({ k: k, t: p[0], side: 0 }); cards.push({ k: k, t: p[1], side: 1 }); });
  cards = shuffled(cards);
  var grid = el('div', { 'class': 'mem-grid' }), open = [], moves = 0, found = 0, lock = false;
  var info = el('p', { 'class': 'sec' }, 'Moves: 0');
  if (ctx.team) ctx.stage.appendChild(ctx.drawTeams());
  ctx.stage.appendChild(info);
  cards.forEach(function (c) {
    c.b = el('button', { 'class': 'mcard', type: 'button', 'aria-label': 'card', onclick: function () { flip(c); } }, '?');
    grid.appendChild(c.b);
  });
  ctx.stage.appendChild(grid);
  function flip(c) {
    if (lock || c.done || open.indexOf(c) >= 0) return;
    c.b.classList.add('up'); clear(c.b); c.b.appendChild(rich(c.t));
    open.push(c);
    if (open.length === 2) {
      moves++; info.textContent = 'Moves: ' + moves;
      var a = open[0], b = open[1];
      if (a.k === b.k) {
        a.done = b.done = true; a.b.classList.add('done'); b.b.classList.add('done'); open = []; found++;
        touchStreak();
        if (ctx.team) ctx.point(ctx.T.turn);
        if (found === pairs.length) {
          var nb = !ctx.team && setBest(ctx.scope, 'memory', moves, true);
          setTimeout(function () { ctx.endScreen('All pairs found!', ['Moves: ' + moves + (nb ? ' — a new best!' : '')]); }, 500);
        }
      } else {
        lock = true;
        setTimeout(function () { [a, b].forEach(function (x) { x.b.classList.remove('up'); clear(x.b); x.b.textContent = '?'; }); open = []; lock = false;
          if (ctx.team) { ctx.T.turn = ctx.T.turn === 'a' ? 'b' : 'a'; ctx.drawTeams(); } }, 900);
      }
    }
  }
  if (ctx.team) ctx.stage.appendChild(ctx.teacherBar(function () {}));
};

function deckRunner(ctx, deck, opts) {
  // runs choice questions from a gated deck in order, starting at a random point
  var start = rnd(deck.length), k = 0;
  return function next() { var id = deck[(start + k) % deck.length]; k++; return id; };
}

  secHead(w, 'Resources', 'amber', 'resources', 'Useful websites and apps. They open outside this app and need the internet.');
  DATA.resources.forEach(function (r) {
    w.appendChild(el('section', { 'class': 'card' }, el('div', { 'class': 'row between' }, el('b', null, r.name), el('span', { 'class': 'badge amber' }, r.kind)),
      el('p', { 'class': 'sec' }, r.what), el('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer', 'class': 'btn small ghost' }, r.url.replace(/^https?:\/\//, ''))));
  });
}
function pageClassroom() {
  var w = page();
  crumbs(w, [['Home', '#/']]);
  secHead(w, 'Classroom English', 'teal', 'classroom', 'All the classroom phrases for this level.');
  [['S', 'You say'], ['T', 'Your teacher says']].forEach(function (g) {
    var c = el('section', { 'class': 'card accent-teal' }, el('h2', null, g[1]));
    c.appendChild(el('ul', { 'class': 'examples' }, DATA.classroom.filter(function (p) { return p.who === g[0]; }).map(function (p) { return el('li', null, el('b', null, p.p), el('div', { 'class': 'sec small-t' }, p.s)); })));
    w.appendChild(c);
  });
}
function pageGrammarIndex() {
  var w = page();
  crumbs(w, [['Home', '#/']]);
  w.appendChild(grammarIndex(false));
}

/* ---------- router ---------- */
function render() {
  var h = location.hash || '#/';
  var p = h.replace(/^#\/?/, '').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (!p.length) return pageHome();
  if (p[0] === 'u') {
    var U = unitByN(+p[1]);
    if (!U) return pageHome();
    if (p.length === 2) { S.last = h; save(); return pageUnit(U); }
    if (p[2] === 'games' && p[3]) { S.last = h; save(); return pageGame(U, p[3]); }
    if (secByK(p[2])) { S.last = h; save(); return pageSection(U, p[2], p[3]); }
    return pageUnit(U);
  }
  switch (p[0]) {
    case 'pile': return pagePile();
    case 'mistakes': return pageMistakes();
    case 'review': return pageReview(p[1]);
    case 'progress': return pageProgress();
    case 'verbs': return DATA.verbs.length ? pageVerbs() : pageHome();
    case 'smarter': return pageSmarter(p[1]);
    case 'resources': return pageResources();
    case 'classroom': return pageClassroom();
    case 'grammar': return pageGrammarIndex();
  }
  return pageHome();
}
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', function () { if (document.hidden) save(true); });

/* ---------- test hook for the smoke test ---------- */
window.__APP = {
  data: DATA, norm: norm, matches: matches,
  go: function (h) { if (location.hash !== h) { location.hash = h; } render(); return MAIN.innerText.length; },
  state: function () { return JSON.parse(JSON.stringify(S)); },
  sets: function () { return Object.keys(SETREG); },
  items: function () { return Object.keys(REG); },
  answer: function (id, ok) { var c = REG[id]; if (!c) return 'missing'; c.autoAnswer(ok); return c.done; },
  item: function (id) { var c = REG[id]; return c ? { done: c.done, score: c.score, tries: c.tries } : null; },
  setScore: function (id) { var s = SETREG[id]; return s ? { finished: !!s.finished, score: s.score, n: s.ctls.length } : null; },
  openAllGrammar: function () { var n = 0; MAIN.querySelectorAll('button[aria-expanded=false]').forEach(function (b) { b.click(); n++; }); return n; },
  sections: SECTIONS.map(function (s) { return s.k; }),
  storeOk: function () { return STORE_OK; }
};

applyClassMode();
render();

</script>
